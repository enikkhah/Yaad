<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <!--
    YAAD Location-Clock Vector Logo (1:1 Verified Geometry)
    Canvas: 1024 x 1024
    Framing: 90% vertical height (Y: 51.2 to 972.8 -> 921.6px height, 51.2px / 5% top & bottom padding)
    Horizontal bounds: X: 170 to 854 (684px width, centered at X = 512)
    Primary Color: Vibrant Amber-Yellow (#FFB020)
  -->

  <!-- Outer Teardrop Location Pin (84px uniform wall thickness, rounded outer tip, sharp inner vertex) -->
  <path
    fill="#FFB020"
    fill-rule="evenodd"
    d="M 512 51.2
       C 700.9 51.2, 854 204.3, 854 393.2
       C 854 576.0, 692.0 788.0, 545.5 956.5
       C 527.8 976.8, 496.2 976.8, 478.5 956.5
       C 332.0 788.0, 170 576.0, 170 393.2
       C 170 204.3, 323.1 51.2, 512 51.2 Z
       M 512 135.2
       C 369.5 135.2, 254 250.7, 254 393.2
       C 254 538.0, 388.0 722.0, 512 863.0
       C 636.0 722.0, 770 538.0, 770 393.2
       C 770 250.7, 654.5 135.2, 512 135.2 Z"
  />

  <!-- Integrated Clock Hands (72px stroke width, rounded caps & rounded elbow join at 12:00 and ~4:00) -->
  <path
    d="M 512 237 L 512 393.2 L 625 458.5"
    stroke="#FFB020"
    stroke-width="72"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
