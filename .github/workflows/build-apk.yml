name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_name:
        description: 'نام نسخه نمایشی در اپ (مثلاً 1.68.4)'
        required: false
        default: '1.68.4'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync App Version Before Web Build
        id: versioning
        env:
          VERSION_NAME: ${{ inputs.version_name || github.event.inputs.version_name || '' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          def to_ascii_digits(s: str) -> str:
              persian = "۰۱۲۳۴۵۶۷۸۹"
              arabic = "٠١٢٣٤٥٦٧٨٩"
              for i in range(10):
                  s = s.replace(persian[i], str(i)).replace(arabic[i], str(i))
              return s.strip()

          pkg_path = Path("package.json")
          pkg_data = json.loads(pkg_path.read_text(encoding="utf-8")) if pkg_path.exists() else {}
          default_ver = pkg_data.get("version", "1.68.4")

          raw_name = to_ascii_digits(os.environ.get("VERSION_NAME", "")) or default_ver
          raw_name = re.sub(r'^[vV]\s*', '', raw_name).strip() or default_ver

          if pkg_path.exists():
              pkg_data["version"] = raw_name
              pkg_path.write_text(json.dumps(pkg_data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          ver_ts_path = Path("src/utils/version.ts")
          if ver_ts_path.exists():
              ver_text = ver_ts_path.read_text(encoding="utf-8")
              ver_text = re.sub(r"'1\.68\.4'", f"'{raw_name}'", ver_text)
              ver_ts_path.write_text(ver_text, encoding="utf-8")

          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a", encoding="utf-8") as f:
                  f.write(f"v_name={raw_name}\n")
          PY

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem --legacy-peer-deps

      - name: Build web app
        env:
          VITE_APP_VERSION: ${{ steps.versioning.outputs.v_name }}
        run: npm run build

      - name: Remove old Android folder
        run: rm -rf android

      - name: Add Android
        run: npx cap add android

      - name: Add Android Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permissions = [
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.WRITE_EXTERNAL_STORAGE",
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.MANAGE_EXTERNAL_STORAGE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.USE_EXACT_ALARM",
              "android.permission.USE_FULL_SCREEN_INTENT",
              "android.permission.SYSTEM_ALERT_WINDOW",
              "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS",
              "android.permission.WAKE_LOCK",
              "android.permission.VIBRATE",
              "android.permission.RECEIVE_BOOT_COMPLETED",
          ]

          marker = "<application"

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      marker,
                      f'<uses-permission android:name="{permission}" />\n\n    {marker}',
                      1
                  )

          if 'android:allowBackup="true"' in text:
              text = text.replace('android:allowBackup="true"', 'android:allowBackup="false"')

          if 'android:requestLegacyExternalStorage="true"' not in text:
              text = text.replace(
                  "<application",
                  '<application\n        android:requestLegacyExternalStorage="true"',
                  1
              )

          path.write_text(text)
          PY

      - name: Copy notification audio files to Android
        run: |
          mkdir -p android/app/src/main/res/raw
          cp public/*.wav android/app/src/main/res/raw/ || true

      - name: Generate Android App Icon (Transparent Background)
        run: |
          npm install @capacitor/assets --legacy-peer-deps
          mkdir -p resources
          cp public/logo-transparent.png resources/icon.png || true
          cp public/splash.png resources/splash.png || true
          cp public/splash.png resources/splash-dark.png || true
          npx capacitor-assets generate --android --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000' || true
          node scripts/generate-transparent-icons.mjs

      - name: Patch Capacitor LocalNotifications for Background Actions
        run: node scripts/patch-capacitor-notifications.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Release Keystore and Configure Release Signing
        working-directory: android
        env:
          V_NAME: ${{ steps.versioning.outputs.v_name }}
        run: |
          keytool -genkey -v -keystore app/release.keystore -alias yaad_release -keyalg RSA -keysize 2048 -validity 10000 -storepass yaad123456 -keypass yaad123456 -dname "CN=Yaad, OU=Mobile, O=YaadApp, L=Tehran, C=IR"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          gradle_file = Path("app/build.gradle")
          if gradle_file.exists():
              content = gradle_file.read_text()
              v_name = os.environ.get("V_NAME", "1.68.4")
              content = re.sub(r'versionName\s+"[^"]*"', f'versionName "{v_name}"', content, count=1)
              signing_block = """
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'yaad123456'
                      keyAlias 'yaad_release'
                      keyPassword 'yaad123456'
                  }
              }
          """
              if "signingConfigs {" not in content:
                  content = content.replace("defaultConfig {", signing_block + "\n    defaultConfig {")

              old_release_block = """release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }"""
              new_release_block = """release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }"""
              if old_release_block in content:
                  content = content.replace(old_release_block, new_release_block)
              elif "signingConfig signingConfigs.debug" in content:
                  content = content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release\n            debuggable false")
              elif "release {" in content and "signingConfig" not in content:
                  content = content.replace("release {", "release {\n            signingConfig signingConfigs.release\n            debuggable false")

              gradle_file.write_text(content)
          PY

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/release/*.apk ../dist-apk/yaad-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Yaad-Release-APK
          path: dist-apk/yaad-release.apk
          if-no-files-found: error
          overwrite: true

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" dist-apk/yaad-release.apk --title "Yaad Release $TAG" --notes "Automated Android APK build ($TAG)" || gh release upload "$TAG" dist-apk/yaad-release.apk --clobber
