name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Remove old Android folder
        run: rm -rf android

      - name: Add Android
        run: npx cap add android

      - name: Add Android Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permissions = [
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.WRITE_EXTERNAL_STORAGE",
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.MANAGE_EXTERNAL_STORAGE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.USE_EXACT_ALARM",
              "android.permission.USE_FULL_SCREEN_INTENT",
              "android.permission.WAKE_LOCK",
              "android.permission.VIBRATE",
              "android.permission.RECEIVE_BOOT_COMPLETED",
          ]

          marker = "<application"

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      marker,
                      f'<uses-permission android:name="{permission}" />\n\n    {marker}',
                      1
                  )

          if 'android:allowBackup="true"' in text:
              text = text.replace('android:allowBackup="true"', 'android:allowBackup="false"')

          if 'android:requestLegacyExternalStorage="true"' not in text:
              text = text.replace(
                  "<application",
                  '<application\n        android:requestLegacyExternalStorage="true"',
                  1
              )

          path.write_text(text)
          PY

      - name: Copy notification audio files to Android
        run: |
          mkdir -p android/app/src/main/res/raw
          cp public/*.wav android/app/src/main/res/raw/ || true

      - name: Generate Android App Icon
        run: |
          npm install @capacitor/assets --legacy-peer-deps
          mkdir -p resources
          cp public/icon.png resources/icon.png || true
          cp public/splash.png resources/splash.png || true
          cp public/splash.png resources/splash-dark.png || true
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000' || true

      - name: Patch Capacitor LocalNotifications for Background Actions
        run: node scripts/patch-capacitor-notifications.mjs

      - name: Sync Capacitor
        run: npx cap sync android 

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Release Keystore and Configure Release Signing
        working-directory: android
        run: |
          keytool -genkey -v -keystore app/release.keystore -alias yaad_release -keyalg RSA -keysize 2048 -validity 10000 -storepass yaad123456 -keypass yaad123456 -dname "CN=Yaad, OU=Mobile, O=YaadApp, L=Tehran, C=IR"
          python3 - <<'PY'
          from pathlib import Path
          gradle_file = Path("app/build.gradle")
          if gradle_file.exists():
              content = gradle_file.read_text()
              signing_block = """
    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'yaad123456'
            keyAlias 'yaad_release'
            keyPassword 'yaad123456'
        }
    }
"""
              if "signingConfigs {" not in content:
                  content = content.replace("defaultConfig {", signing_block + "\n    defaultConfig {")
              
              old_release_block = """release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }"""
              new_release_block = """release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }"""
              if old_release_block in content:
                  content = content.replace(old_release_block, new_release_block)
              elif "signingConfig signingConfigs.debug" in content:
                  content = content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release\n            debuggable false")
              elif "release {" in content and "signingConfig" not in content:
                  content = content.replace("release {", "release {\n            signingConfig signingConfigs.release\n            debuggable false")

              gradle_file.write_text(content)
          PY

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/release/*.apk ../dist-apk/yaad-release.apk || true
          cp app/build/outputs/apk/release/*.apk ../dist-apk/ || true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yaad-Release-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            dist-apk/*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Yaad Release v${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/*.apk
            dist-apk/yaad-release.apk
