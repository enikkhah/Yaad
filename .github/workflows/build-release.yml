name: Build Yaad Release (AAB & APK)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_code:
        description: 'کد نسخه عددی (auto = افزایش خودکار در هر بیلد)'
        required: false
        default: 'auto'
      version_name:
        description: 'نام نسخه نمایشی (auto = افزایش خودکار از 1.2.5 به بعد)'
        required: false
        default: 'auto'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        store: [bazaar, myket]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check signing secrets
        env:
          KS: ${{ secrets.YAAD_KEYSTORE_BASE64 }}
          SP: ${{ secrets.YAAD_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.YAAD_KEY_ALIAS }}
          KP: ${{ secrets.YAAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$SP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Signing secrets are missing. Build stopped."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (locked)
        run: npm ci --legacy-peer-deps

      - name: Sync App Version Before Web Build (Splash, About, Settings & Package)
        id: versioning
        env:
          VERSION_CODE: ${{ inputs.version_code || github.event.inputs.version_code || 'auto' }}
          VERSION_NAME: ${{ inputs.version_name || github.event.inputs.version_name || 'auto' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          def to_ascii_digits(s: str) -> str:
              persian = "۰۱۲۳۴۵۶۷۸۹"
              arabic = "٠١٢٣٤٥٦٧٨٩"
              for i in range(10):
                  s = s.replace(persian[i], str(i)).replace(arabic[i], str(i))
              return s.strip()

          run_num_str = re.sub(r"\D", "", to_ascii_digits(os.environ.get("RUN_NUMBER", "95")))
          run_num = int(run_num_str) if run_num_str else 95

          raw_code_in = to_ascii_digits(os.environ.get("VERSION_CODE", "auto"))
          raw_name_in = to_ascii_digits(os.environ.get("VERSION_NAME", "auto"))

          # Base version 1.2.5 at GitHub Actions run #95 (continuing from 1.2.4)
          offset = max(0, run_num - 95)
          auto_version_name = f"1.2.{5 + offset}"
          auto_version_code = 100 + run_num

          if not raw_name_in or raw_name_in.lower() == "auto":
              raw_name = auto_version_name
          else:
              raw_name = re.sub(r'^[vV]\s*', '', raw_name_in).strip() or auto_version_name

          if not raw_code_in or raw_code_in.lower() == "auto":
              v_code = auto_version_code
          else:
              digits_only = re.sub(r"\D", "", raw_code_in)
              v_code = int(digits_only) if digits_only else auto_version_code

          if v_code < 1:
              v_code = auto_version_code
          if v_code > 2100000000:
              v_code = auto_version_code

          # 1. Update package.json version so Vite injects it into __APP_VERSION__
          pkg_path = Path("package.json")
          if pkg_path.exists():
              pkg_data = json.loads(pkg_path.read_text(encoding="utf-8"))
              pkg_data["version"] = raw_name
              pkg_path.write_text(json.dumps(pkg_data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          # 2. Update fallback in src/utils/version.ts
          ver_ts_path = Path("src/utils/version.ts")
          if ver_ts_path.exists():
              ver_text = ver_ts_path.read_text(encoding="utf-8")
              ver_text = re.sub(r"'1\.\d+\.\d+'", f"'{raw_name}'", ver_text)
              ver_ts_path.write_text(ver_text, encoding="utf-8")

          print(f"Synced app version across web app: versionName={raw_name}, versionCode={v_code} (run_number={run_num})")

          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a", encoding="utf-8") as f:
                  f.write(f"v_code={v_code}\n")
                  f.write(f"v_name={raw_name}\n")
          PY

      - name: Verify Privacy Policy Synchronization (public/privacy.html vs docs/privacy.html)
        run: |
          if [ ! -f "public/privacy.html" ] || [ ! -f "docs/privacy.html" ]; then
            echo "::error::Both public/privacy.html and docs/privacy.html must exist."
            exit 1
          fi
          if ! cmp -s public/privacy.html docs/privacy.html; then
            echo "::error::public/privacy.html and docs/privacy.html are out of sync! Run 'node scripts/sync-privacy.mjs' and commit both files."
            diff -u public/privacy.html docs/privacy.html || true
            exit 1
          fi
          echo "✅ public/privacy.html and docs/privacy.html are identical."

      - name: Run TypeScript & Build Verification Lint
        run: npm run lint

      - name: Build web app with synced version & store target
        env:
          VITE_APP_VERSION: ${{ steps.versioning.outputs.v_name }}
          VITE_STORE: ${{ matrix.store }}
          VITE_BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY || '' }}
          VITE_MYKET_RSA_PUBLIC_KEY: ${{ secrets.MYKET_RSA_PUBLIC_KEY || '' }}
          VITE_BAZAAR_PRO_PRODUCT_ID: ${{ secrets.BAZAAR_PRO_PRODUCT_ID || 'yaad_pro_lifetime' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || '' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || '' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || '' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || '' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '' }}
          VITE_FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_FIRESTORE_DATABASE_ID || '' }}
        run: npm run build

      - name: Remove old Android folder
        run: rm -rf android

      - name: Add Android
        run: npx cap add android

      - name: Add Android Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")

          # Replace any existing unattributed SCHEDULE_EXACT_ALARM with maxSdkVersion="32"
          text = re.sub(
              r'\s*<uses-permission[^>]*android:name="android\.permission\.SCHEDULE_EXACT_ALARM"[^>]*\/?>',
              '',
              text
          )

          permissions = [
              ("android.permission.CAMERA", ""),
              ("android.permission.RECORD_AUDIO", ""),
              ("android.permission.MODIFY_AUDIO_SETTINGS", ""),
              ("android.permission.ACCESS_COARSE_LOCATION", ""),
              ("android.permission.ACCESS_FINE_LOCATION", ""),
              ("android.permission.ACCESS_BACKGROUND_LOCATION", ""),
              ("android.permission.FOREGROUND_SERVICE", ""),
              ("android.permission.FOREGROUND_SERVICE_LOCATION", ""),
              ("android.permission.POST_NOTIFICATIONS", ""),
              ("android.permission.SCHEDULE_EXACT_ALARM", ' android:maxSdkVersion="32"'),
              ("android.permission.USE_EXACT_ALARM", ""),
              ("android.permission.USE_FULL_SCREEN_INTENT", ""),
              ("android.permission.WAKE_LOCK", ""),
              ("android.permission.VIBRATE", ""),
              ("android.permission.RECEIVE_BOOT_COMPLETED", ""),
          ]

          marker = "<application"

          for permission, extra_attrs in permissions:
              if f'android:name="{permission}"' not in text:
                  text = text.replace(
                      marker,
                      f'<uses-permission android:name="{permission}"{extra_attrs} />\n\n    {marker}',
                      1
                  )

          if 'android:allowBackup="true"' in text:
              text = text.replace('android:allowBackup="true"', 'android:allowBackup="false"')

          path.write_text(text, encoding="utf-8")
          PY

      - name: Copy notification audio files to Android
        run: |
          mkdir -p android/app/src/main/res/raw
          cp public/*.wav android/app/src/main/res/raw/

      - name: Generate Android App Icon (Transparent Background)
        run: |
          mkdir -p resources
          cp public/logo-transparent.png resources/icon.png || true
          cp public/splash.png resources/splash.png || true
          cp public/splash.png resources/splash-dark.png || true
          node scripts/generate-transparent-icons.mjs

      - name: Patch Capacitor LocalNotifications for Background Actions
        run: node scripts/patch-capacitor-notifications.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure Android Launcher Name (یاد) in strings.xml
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          strings_path = Path("android/app/src/main/res/values/strings.xml")
          if strings_path.exists():
              text = strings_path.read_text(encoding="utf-8")
              text = re.sub(r'(<string name="app_name">)(.*?)(</string>)', r'\g<1>یاد\g<3>', text)
              text = re.sub(r'(<string name="title_activity_main">)(.*?)(</string>)', r'\g<1>یاد\g<3>', text)
              strings_path.write_text(text, encoding="utf-8")
              print("Updated strings.xml app_name and title_activity_main to 'یاد'")
          PY

      - name: Setup Cafe Bazaar Poolakey Billing Plugin
        if: matrix.store == 'bazaar'
        run: node scripts/setup-bazaar-poolakey.mjs

      - name: Setup Myket IAB Billing Plugin
        if: matrix.store == 'myket'
        run: node scripts/setup-myket-billing.mjs

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download and Verify Official Gradle Distribution (SHA-256)
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x ./gradlew

          PROPS_FILE="gradle/wrapper/gradle-wrapper.properties"
          WRAPPER_MATCH=$(grep -oE 'gradle-[0-9.]+-(all|bin)\.zip' "$PROPS_FILE" | head -n 1 || true)
          GRADLE_ZIP=${WRAPPER_MATCH:-gradle-8.14.3-bin.zip}
          GRADLE_VER=$(echo "$GRADLE_ZIP" | sed -E 's/gradle-([0-9.]+)-(all|bin)\.zip/\1/')
          GRADLE_TYPE=$(echo "$GRADLE_ZIP" | sed -E 's/gradle-[0-9.]+-(all|bin)\.zip/\1/')
          OFFICIAL_URL="https://services.gradle.org/distributions/${GRADLE_ZIP}"
          OFFICIAL_SHA_URL="${OFFICIAL_URL}.sha256"

          mkdir -p /tmp/gradle-dist
          LOCAL_ZIP="/tmp/gradle-dist/${GRADLE_ZIP}"
          LOCAL_SHA="/tmp/gradle-dist/${GRADLE_ZIP}.sha256"

          echo "Fetching official SHA-256 for ${GRADLE_ZIP}..."
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 30 \
            -A "Mozilla/5.0" "${OFFICIAL_SHA_URL}" -o "${LOCAL_SHA}"

          OFFICIAL_SHA=$(tr -d ' \t\r\n' < "${LOCAL_SHA}" | grep -oE '^[0-9a-fA-F]{64}' | tr '[:upper:]' '[:lower:]')
          if [ -z "$OFFICIAL_SHA" ]; then
            echo "::error::Failed to retrieve a valid official SHA-256 checksum for ${GRADLE_ZIP}."
            exit 1
          fi

          EXISTING_SHA=$(grep -E '^distributionSha256Sum=' "$PROPS_FILE" | head -n 1 | cut -d'=' -f2 | tr -d ' \t\r\n' | tr '[:upper:]' '[:lower:]' || true)
          if [ -n "$EXISTING_SHA" ] && [ "$EXISTING_SHA" != "$OFFICIAL_SHA" ]; then
            echo "::error::gradle-wrapper.properties distributionSha256Sum (${EXISTING_SHA}) does not match official Gradle SHA-256 (${OFFICIAL_SHA})!"
            exit 1
          fi

          echo "Downloading official ${GRADLE_ZIP}..."
          if [ ! -s "${LOCAL_ZIP}" ]; then
            curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 \
              -A "Mozilla/5.0" "${OFFICIAL_URL}" -o "${LOCAL_ZIP}" || rm -f "${LOCAL_ZIP}"
          fi
          if [ ! -s "${LOCAL_ZIP}" ]; then
            gh release download "v${GRADLE_VER}" --repo gradle/gradle-distributions --pattern "${GRADLE_ZIP}" --dir /tmp/gradle-dist --clobber || true
          fi
          if [ ! -s "${LOCAL_ZIP}" ]; then
            echo "::error::Failed to download ${GRADLE_ZIP} from official sources."
            exit 1
          fi

          echo "Verifying SHA-256 checksum for ${LOCAL_ZIP}..."
          echo "${OFFICIAL_SHA}  ${LOCAL_ZIP}" | sha256sum -c -

          python3 - "$PROPS_FILE" "$OFFICIAL_URL" "$OFFICIAL_SHA" "$GRADLE_VER" "$GRADLE_TYPE" "$LOCAL_ZIP" <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import shutil
          import sys

          props_path = Path(sys.argv[1])
          official_url = sys.argv[2]
          official_sha = sys.argv[3]
          gradle_ver = sys.argv[4]
          gradle_type = sys.argv[5]
          local_zip = Path(sys.argv[6])

          escaped_url = official_url.replace("://", "\\://")
          lines = props_path.read_text(encoding="utf-8").splitlines()
          out_lines = []
          has_url = False
          has_validate = False
          has_sha = False

          for line in lines:
              if line.startswith("distributionUrl="):
                  out_lines.append(f"distributionUrl={escaped_url}")
                  has_url = True
              elif line.startswith("validateDistributionUrl="):
                  out_lines.append("validateDistributionUrl=true")
                  has_validate = True
              elif line.startswith("distributionSha256Sum="):
                  out_lines.append(f"distributionSha256Sum={official_sha}")
                  has_sha = True
              else:
                  out_lines.append(line)

          if not has_url:
              out_lines.append(f"distributionUrl={escaped_url}")
          if not has_validate:
              out_lines.append("validateDistributionUrl=true")
          if not has_sha:
              out_lines.append(f"distributionSha256Sum={official_sha}")

          props_path.write_text("\n".join(out_lines) + "\n", encoding="utf-8")

          # Pre-seed Gradle Wrapper cache using exact Java BigInteger(1, MD5).toString(36) path
          md5_num = int.from_bytes(hashlib.md5(official_url.encode("utf-8")).digest(), "big")
          alphabet = "0123456789abcdefghijklmnopqrstuvwxyz"
          if md5_num == 0:
              dist_hash = "0"
          else:
              chars = []
              while md5_num > 0:
                  md5_num, rem = divmod(md5_num, 36)
                  chars.append(alphabet[rem])
              dist_hash = "".join(reversed(chars))

          gradle_home = Path(os.environ.get("GRADLE_USER_HOME", str(Path.home() / ".gradle")))
          cache_dir = gradle_home / "wrapper" / "dists" / f"gradle-{gradle_ver}-{gradle_type}" / dist_hash
          cache_dir.mkdir(parents=True, exist_ok=True)
          shutil.copy2(local_zip, cache_dir / local_zip.name)
          print(f"Pre-seeded verified Gradle archive in {cache_dir}")
          PY

          cat "$PROPS_FILE"
          ./gradlew --version --no-daemon

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YAAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/yaad-release.jks

      - name: Configure Android Gradle release signing and versioning
        env:
          V_CODE: ${{ steps.versioning.outputs.v_code }}
          V_NAME: ${{ steps.versioning.outputs.v_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          v_code = int(os.environ.get("V_CODE", "1"))
          v_name = os.environ.get("V_NAME", "1.2.5")

          text = re.sub(r'versionCode\s+\d+', f'versionCode {v_code}', text, count=1)
          text = re.sub(r'versionName\s+"[^"]*"', f'versionName "{v_name}"', text, count=1)

          signing = """
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
              signingConfigs {
                  release {
                      storeFile file("yaad-release.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          text = text.replace("android {", "android {" + signing, 1)

          pattern = r'(buildTypes\s*\{\s*release\s*\{)'
          replacement = r'\1\n            signingConfig signingConfigs.release'
          text, count = re.subn(pattern, replacement, text, count=1)

          if count != 1:
              raise RuntimeError("Release build type not found")

          path.write_text(text, encoding="utf-8")

          # Add HTTP retry and timeout resilience to android/gradle.properties
          gradle_props = Path("android/gradle.properties")
          if gradle_props.exists():
              g_text = gradle_props.read_text(encoding="utf-8")
              extra_props = (
                  "\norg.gradle.internal.http.connectionTimeout=120000\n"
                  "org.gradle.internal.http.socketTimeout=120000\n"
                  "systemProp.org.gradle.internal.http.connectionTimeout=120000\n"
                  "systemProp.org.gradle.internal.http.socketTimeout=120000\n"
                  "org.gradle.internal.repository.max.tentatives=5\n"
                  "org.gradle.internal.repository.initial.backoff=2000\n"
              )
              if "org.gradle.internal.http.connectionTimeout" not in g_text:
                  gradle_props.write_text(g_text + extra_props, encoding="utf-8")

          print(f"Configured Android Gradle versionCode={v_code}, versionName={v_name}")
          PY

      - name: Build Release AAB and APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.YAAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YAAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YAAD_KEY_PASSWORD }}
          STORE_TARGET: ${{ matrix.store }}
          V_CODE: ${{ steps.versioning.outputs.v_code }}
          V_NAME: ${{ steps.versioning.outputs.v_name }}
        run: |
          # Run release AAB + APK build using verified Gradle distribution with automatic retry on transient network timeouts
          BUILD_OK=0
          for attempt in 1 2 3; do
            echo "Running Gradle bundleRelease assembleRelease for ${STORE_TARGET} (attempt $attempt/3)..."
            if ./gradlew bundleRelease assembleRelease --no-daemon; then
              BUILD_OK=1
              break
            fi
            echo "::warning::Gradle build attempt $attempt failed; retrying in 5 seconds..."
            sleep 5
          done
          if [ "$BUILD_OK" -ne 1 ]; then
            echo "::error::Gradle release build failed after 3 attempts."
            exit 1
          fi

          mkdir -p ../dist-release/aab ../dist-release/apk
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$AAB_FILE" ] || [ ! -s "$AAB_FILE" ]; then
            echo "::error::Release AAB file was not generated!"
            exit 1
          fi
          if [ -z "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
            echo "::error::Release APK file was not generated!"
            exit 1
          fi
          cp "$AAB_FILE" "../dist-release/aab/Yaad-v${V_NAME}-b${V_CODE}-${STORE_TARGET}-release.aab"
          cp "$APK_FILE" "../dist-release/apk/Yaad-v${V_NAME}-b${V_CODE}-${STORE_TARGET}-release.apk"
          ls -lh ../dist-release/aab ../dist-release/apk

      - name: Upload Release AAB (${{ matrix.store }})
        id: upload_aab
        uses: actions/upload-artifact@v6
        with:
          name: Yaad-Release-AAB-${{ matrix.store }}
          path: dist-release/aab/*.aab
          if-no-files-found: error
          overwrite: true

      - name: Upload Release APK (${{ matrix.store }})
        id: upload_apk
        uses: actions/upload-artifact@v6
        with:
          name: Yaad-Release-APK-${{ matrix.store }}
          path: dist-release/apk/*.apk
          if-no-files-found: error
          overwrite: true

      - name: Retry Upload Release APK (${{ matrix.store }})
        id: retry_apk
        if: steps.upload_apk.outputs.artifact-id == ''
        uses: actions/upload-artifact@v6
        with:
          name: Yaad-Release-APK-${{ matrix.store }}
          path: dist-release/apk/*.apk
          if-no-files-found: error
          overwrite: true

      - name: Inspect Built Manifest & Publish Build Summary
        env:
          STORE_TARGET: ${{ matrix.store }}
          HAS_BAZAAR_RSA: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY != '' }}
          HAS_MYKET_RSA: ${{ secrets.MYKET_RSA_PUBLIC_KEY != '' }}
          AAB_ID: ${{ steps.upload_aab.outputs.artifact-id }}
          AAB_URL: ${{ steps.upload_aab.outputs.artifact-url }}
          APK_ID: ${{ steps.upload_apk.outputs.artifact-id || steps.retry_apk.outputs.artifact-id }}
          APK_URL: ${{ steps.upload_apk.outputs.artifact-url || steps.retry_apk.outputs.artifact-url }}
          V_CODE: ${{ steps.versioning.outputs.v_code }}
          V_NAME: ${{ steps.versioning.outputs.v_name }}
        run: |
          if [ -z "$AAB_ID" ]; then
            echo "::error::AAB artifact upload did not return an artifact ID."
            exit 1
          fi
          if [ -z "$APK_ID" ]; then
            echo "::error::APK artifact upload did not return an artifact ID."
            exit 1
          fi

          APK_PATH=$(find dist-release/apk -name "*.apk" | head -n 1)
          MERGED_MANIFEST="android/app/build/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml"
          AAPT2_BIN=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1 || true)

          MANIFEST_REPORT=$(python3 - "$MERGED_MANIFEST" "$APK_PATH" "$AAPT2_BIN" <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          manifest_path = Path(sys.argv[1])
          apk_path = sys.argv[2]
          aapt2_bin = sys.argv[3]

          android_ns = "{http://schemas.android.com/apk/res/android}"
          perms = []
          target_sdk = "unknown"
          min_sdk = "unknown"
          v_code = "unknown"
          v_name = "unknown"
          app_label = "unknown"

          if aapt2_bin and apk_path:
              try:
                  badging = subprocess.check_output([aapt2_bin, "dump", "badging", apk_path], text=True)
                  for line in badging.splitlines():
                      if line.startswith("package:"):
                          for part in line.split():
                              if part.startswith("versionCode="):
                                  v_code = part.split("=", 1)[1].strip("'")
                              elif part.startswith("versionName="):
                                  v_name = part.split("=", 1)[1].strip("'")
                      elif line.startswith("sdkVersion:"):
                          min_sdk = line.split(":", 1)[1].strip().strip("'")
                      elif line.startswith("targetSdkVersion:"):
                          target_sdk = line.split(":", 1)[1].strip().strip("'")
                      elif line.startswith("application-label:"):
                          app_label = line.split(":", 1)[1].strip().strip("'")
              except Exception as exc:
                  print(f"aapt2 badging warning: {exc}", file=sys.stderr)

          if manifest_path.exists():
              tree = ET.parse(manifest_path)
              root = tree.getroot()
              if v_code == "unknown":
                  v_code = root.attrib.get(f"{android_ns}versionCode", v_code)
              if v_name == "unknown":
                  v_name = root.attrib.get(f"{android_ns}versionName", v_name)
              uses_sdk = root.find("uses-sdk")
              if uses_sdk is not None:
                  if target_sdk == "unknown":
                      target_sdk = uses_sdk.attrib.get(f"{android_ns}targetSdkVersion", target_sdk)
                  if min_sdk == "unknown":
                      min_sdk = uses_sdk.attrib.get(f"{android_ns}minSdkVersion", min_sdk)
              for el in root.findall("uses-permission"):
                  name = el.attrib.get(f"{android_ns}name", "")
                  max_sdk = el.attrib.get(f"{android_ns}maxSdkVersion", "")
                  if name:
                      perms.append(f"{name}" + (f" (maxSdkVersion={max_sdk})" if max_sdk else ""))

          if not perms and aapt2_bin and apk_path:
              try:
                  dump_perms = subprocess.check_output([aapt2_bin, "dump", "permissions", apk_path], text=True)
                  for line in dump_perms.splitlines():
                      if line.startswith("uses-permission:"):
                          perms.append(line)
              except Exception as exc:
                  print(f"aapt2 permissions warning: {exc}", file=sys.stderr)

          print(f"APP_LABEL={app_label}")
          print(f"TARGET_SDK={target_sdk}")
          print(f"MIN_SDK={min_sdk}")
          print(f"MANIFEST_VCODE={v_code}")
          print(f"MANIFEST_VNAME={v_name}")
          print("PERMS_START")
          for p in sorted(set(perms)):
              print(f"- \`{p}\`")
          print("PERMS_END")
          PY
          )

          echo "$MANIFEST_REPORT"
          TARGET_SDK=$(echo "$MANIFEST_REPORT" | sed -n 's/^TARGET_SDK=//p' | head -n 1)
          MIN_SDK=$(echo "$MANIFEST_REPORT" | sed -n 's/^MIN_SDK=//p' | head -n 1)
          MANIFEST_VCODE=$(echo "$MANIFEST_REPORT" | sed -n 's/^MANIFEST_VCODE=//p' | head -n 1)
          MANIFEST_VNAME=$(echo "$MANIFEST_REPORT" | sed -n 's/^MANIFEST_VNAME=//p' | head -n 1)
          APP_LABEL=$(echo "$MANIFEST_REPORT" | sed -n 's/^APP_LABEL=//p' | head -n 1)
          PERMS_LIST=$(echo "$MANIFEST_REPORT" | awk '/^PERMS_START$/{flag=1;next}/^PERMS_END$/{flag=0}flag')

          RSA_STATUS="موجود"
          if [ "$STORE_TARGET" = "bazaar" ] && [ "$HAS_BAZAAR_RSA" != "true" ]; then
            RSA_STATUS="کلید RSA تنظیم نشده (پرداخت غیرفعال در UI)"
          elif [ "$STORE_TARGET" = "myket" ] && [ "$HAS_MYKET_RSA" != "true" ]; then
            RSA_STATUS="کلید RSA تنظیم نشده (پرداخت غیرفعال در UI)"
          fi

          FINAL_VNAME="${MANIFEST_VNAME:-$V_NAME}"
          FINAL_VCODE="${MANIFEST_VCODE:-$V_CODE}"

          # Render store/RELEASE_INFO-${STORE_TARGET}.md from store/listing-fa.md template
          if [ -f "store/listing-fa.md" ]; then
            sed -e "s/{{VERSION_NAME}}/${FINAL_VNAME}/g" \
                -e "s/{{VERSION_CODE}}/${FINAL_VCODE}/g" \
                -e "s/{{STORE_TARGET}}/${STORE_TARGET}/g" \
                store/listing-fa.md > "store/RELEASE_INFO-${STORE_TARGET}.md"
          fi

          {
            echo "### ✅ ساخت نسخه انتشار یاد — فروشگاه \`${STORE_TARGET}\`"
            echo ""
            echo "- **فروشگاه هدف (VITE_STORE):** \`${STORE_TARGET}\` • **وضعیت کلید RSA:** ${RSA_STATUS}"
            echo "- **نام برنامه در مانیفست (Launcher):** \`${APP_LABEL}\`"
            echo "- **نام نسخه اعمال‌شده در کل اپ و اندروید:** \`${FINAL_VNAME}\`"
            echo "- **کد نسخه (versionCode در مانیفست):** \`${FINAL_VCODE}\`"
            echo "- **targetSdk:** \`${TARGET_SDK}\` • **minSdk:** \`${MIN_SDK}\`"
            echo ""
            echo "| نوع خروجی | نام آرتیفکت | وضعیت | لینک دانلود مستقیم |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **AAB (${STORE_TARGET})** | \`Yaad-Release-AAB-${STORE_TARGET}\` | ✅ آماده (\`#${AAB_ID}\`) | [دانلود AAB (${STORE_TARGET})](${AAB_URL}) |"
            echo "| **APK (${STORE_TARGET})** | \`Yaad-Release-APK-${STORE_TARGET}\` | ✅ آماده (\`#${APK_ID}\`) | [دانلود APK (${STORE_TARGET})](${APK_URL}) |"
            echo ""
            echo "#### 📋 متن آماده یادداشت انتشار (Release Notes) برای پنل \`${STORE_TARGET}\`"
            echo "\`\`\`text"
            echo "نسخه ${FINAL_VNAME} (کد نسخه ${FINAL_VCODE}):"
            echo "• ۴۰ روز دسترسی هدیه به تمام امکانات حرفه‌ای (Pro) از اولین اجرا + جشنواره لانچ برای ۷۳۰ نصب اول با کد بازیابی ۱۲ کاراکتری"
            echo "• رایگان شدن همیشگی «خروجی گرفتن و بازیابی فایل پشتیبان (JSON)» برای همه کاربران"
            echo "• پشتیبانی از تمدید اشتراک یک‌ساله و محافظت هوشمند از وضعیت خرید کاربران در برابر قطعی موقت شبکه"
            echo "• بهبود دقت آلارم‌های پس‌زمینه، اعلان تمام‌صفحه روی صفحه قفل و پایش کم‌مصرف حصار مکانی (Geofence)"
            echo "\`\`\`"
            echo ""
            echo "#### فهرست مجوزهای مانیفست نهایی (${STORE_TARGET})"
            echo "${PERMS_LIST}"
          } >> "$GITHUB_STEP_SUMMARY"
