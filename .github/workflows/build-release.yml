name: Build Yaad Release (AAB & APK)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_code:
        description: 'کد نسخه عددی (auto = افزایش خودکار در هر بیلد)'
        required: false
        default: 'auto'
      version_name:
        description: 'نام نسخه نمایشی (auto = افزایش خودکار از 1.2.5 به بعد)'
        required: false
        default: 'auto'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check signing secrets
        env:
          KS: ${{ secrets.YAAD_KEYSTORE_BASE64 }}
          SP: ${{ secrets.YAAD_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.YAAD_KEY_ALIAS }}
          KP: ${{ secrets.YAAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$SP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Signing secrets are missing. Build stopped."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync App Version Before Web Build (Splash, About, Settings & Package)
        id: versioning
        env:
          VERSION_CODE: ${{ inputs.version_code || github.event.inputs.version_code || 'auto' }}
          VERSION_NAME: ${{ inputs.version_name || github.event.inputs.version_name || 'auto' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          def to_ascii_digits(s: str) -> str:
              persian = "۰۱۲۳۴۵۶۷۸۹"
              arabic = "٠١٢٣٤٥٦٧٨٩"
              for i in range(10):
                  s = s.replace(persian[i], str(i)).replace(arabic[i], str(i))
              return s.strip()

          run_num_str = re.sub(r"\D", "", to_ascii_digits(os.environ.get("RUN_NUMBER", "95")))
          run_num = int(run_num_str) if run_num_str else 95

          raw_code_in = to_ascii_digits(os.environ.get("VERSION_CODE", "auto"))
          raw_name_in = to_ascii_digits(os.environ.get("VERSION_NAME", "auto"))

          # Base version 1.2.5 at GitHub Actions run #95 (continuing from 1.2.4)
          offset = max(0, run_num - 95)
          auto_version_name = f"1.2.{5 + offset}"
          auto_version_code = 100 + run_num

          if not raw_name_in or raw_name_in.lower() == "auto":
              raw_name = auto_version_name
          else:
              raw_name = re.sub(r'^[vV]\s*', '', raw_name_in).strip() or auto_version_name

          if not raw_code_in or raw_code_in.lower() == "auto":
              v_code = auto_version_code
          else:
              digits_only = re.sub(r"\D", "", raw_code_in)
              v_code = int(digits_only) if digits_only else auto_version_code

          if v_code < 1:
              v_code = auto_version_code
          if v_code > 2100000000:
              v_code = auto_version_code

          # 1. Update package.json version so Vite injects it into __APP_VERSION__
          pkg_path = Path("package.json")
          if pkg_path.exists():
              pkg_data = json.loads(pkg_path.read_text(encoding="utf-8"))
              pkg_data["version"] = raw_name
              pkg_path.write_text(json.dumps(pkg_data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          # 2. Update fallback in src/utils/version.ts
          ver_ts_path = Path("src/utils/version.ts")
          if ver_ts_path.exists():
              ver_text = ver_ts_path.read_text(encoding="utf-8")
              ver_text = re.sub(r"'1\.\d+\.\d+'", f"'{raw_name}'", ver_text)
              ver_ts_path.write_text(ver_text, encoding="utf-8")

          print(f"Synced app version across web app: versionName={raw_name}, versionCode={v_code} (run_number={run_num})")

          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a", encoding="utf-8") as f:
                  f.write(f"v_code={v_code}\n")
                  f.write(f"v_name={raw_name}\n")
          PY

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem --legacy-peer-deps --ignore-scripts

      - name: Build web app with synced version
        env:
          VITE_APP_VERSION: ${{ steps.versioning.outputs.v_name }}
          VITE_BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY || '' }}
          VITE_BAZAAR_PRO_PRODUCT_ID: ${{ secrets.BAZAAR_PRO_PRODUCT_ID || 'yaad_pro_lifetime' }}
        run: npm run build

      - name: Remove old Android folder
        run: rm -rf android

      - name: Add Android
        run: npx cap add android

      - name: Add Android Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permissions = [
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_BACKGROUND_LOCATION",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_LOCATION",
              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.WRITE_EXTERNAL_STORAGE",
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.MANAGE_EXTERNAL_STORAGE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.USE_EXACT_ALARM",
              "android.permission.USE_FULL_SCREEN_INTENT",
              "android.permission.SYSTEM_ALERT_WINDOW",
              "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS",
              "android.permission.WAKE_LOCK",
              "android.permission.DISABLE_KEYGUARD",
              "android.permission.VIBRATE",
              "android.permission.RECEIVE_BOOT_COMPLETED",
          ]

          marker = "<application"

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      marker,
                      f'<uses-permission android:name="{permission}" />\n\n    {marker}',
                      1
                  )

          if 'android:allowBackup="true"' in text:
              text = text.replace('android:allowBackup="true"', 'android:allowBackup="false"')

          if 'android:requestLegacyExternalStorage="true"' not in text:
              text = text.replace(
                  "<application",
                  '<application\n        android:requestLegacyExternalStorage="true"',
                  1
              )

          if 'android:showWhenLocked="true"' not in text and 'android:name=".MainActivity"' in text:
              text = text.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity"\n            android:showWhenLocked="true"\n            android:turnScreenOn="true"',
                  1
              )

          path.write_text(text)
          PY

      - name: Copy notification audio files to Android
        run: |
          mkdir -p android/app/src/main/res/raw
          cp public/*.wav android/app/src/main/res/raw/

      - name: Generate Android App Icon (Transparent Background)
        run: |
          mkdir -p resources
          cp public/logo-transparent.png resources/icon.png || true
          cp public/splash.png resources/splash.png || true
          cp public/splash.png resources/splash-dark.png || true
          node scripts/generate-transparent-icons.mjs

      - name: Patch Capacitor LocalNotifications for Background Actions
        run: node scripts/patch-capacitor-notifications.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Cafe Bazaar Poolakey Billing Plugin
        run: node scripts/setup-bazaar-poolakey.mjs

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YAAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/yaad-release.jks

      - name: Configure Android Gradle release signing and versioning
        env:
          V_CODE: ${{ steps.versioning.outputs.v_code }}
          V_NAME: ${{ steps.versioning.outputs.v_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          v_code = int(os.environ.get("V_CODE", "1"))
          v_name = os.environ.get("V_NAME", "1.2.5")

          text = re.sub(r'versionCode\s+\d+', f'versionCode {v_code}', text, count=1)
          text = re.sub(r'versionName\s+"[^"]*"', f'versionName "{v_name}"', text, count=1)

          signing = """
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
              signingConfigs {
                  release {
                      storeFile file("yaad-release.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          text = text.replace("android {", "android {" + signing, 1)

          pattern = r'(buildTypes\s*\{\s*release\s*\{)'
          replacement = r'\1\n            signingConfig signingConfigs.release'
          text, count = re.subn(pattern, replacement, text, count=1)

          if count != 1:
              raise RuntimeError("Release build type not found")

          path.write_text(text)

          # Add HTTP retry and timeout resilience to android/gradle.properties
          gradle_props = Path("android/gradle.properties")
          if gradle_props.exists():
              g_text = gradle_props.read_text(encoding="utf-8")
              extra_props = (
                  "\norg.gradle.internal.http.connectionTimeout=120000\n"
                  "org.gradle.internal.http.socketTimeout=120000\n"
                  "systemProp.org.gradle.internal.http.connectionTimeout=120000\n"
                  "systemProp.org.gradle.internal.http.socketTimeout=120000\n"
                  "org.gradle.internal.repository.max.tentatives=5\n"
                  "org.gradle.internal.repository.initial.backoff=2000\n"
              )
              if "org.gradle.internal.http.connectionTimeout" not in g_text:
                  gradle_props.write_text(g_text + extra_props, encoding="utf-8")

          print(f"Configured Android Gradle versionCode={v_code}, versionName={v_name}")
          PY

      - name: Build Release AAB and APK
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_PASSWORD: ${{ secrets.YAAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YAAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YAAD_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew

          # 1. Pre-download Gradle binary zip locally using authenticated GH_TOKEN or non-GitHub mirror
          # so ./gradlew reads from local disk (file:///) and NEVER hits GitHub unauthenticated rate limits.
          GRADLE_VER=$(grep -oE 'gradle-[0-9.]+-(all|bin)\.zip' gradle/wrapper/gradle-wrapper.properties | sed -E 's/gradle-([0-9.]+)-(all|bin)\.zip/\1/' | head -n 1)
          GRADLE_VER=${GRADLE_VER:-8.14.3}
          GRADLE_ZIP="gradle-${GRADLE_VER}-bin.zip"
          LOCAL_ZIP="/tmp/gradle-dist/${GRADLE_ZIP}"
          mkdir -p /tmp/gradle-dist

          echo "Downloading ${GRADLE_ZIP} to local disk (${LOCAL_ZIP})..."
          if [ ! -s "${LOCAL_ZIP}" ]; then
            gh release download "v${GRADLE_VER}" --repo gradle/gradle-distributions --pattern "${GRADLE_ZIP}" --dir /tmp/gradle-dist --clobber || true
          fi

          if [ ! -s "${LOCAL_ZIP}" ]; then
            echo "Trying direct cloud mirror (mirrors.cloud.tencent.com)..."
            curl -fL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 30 \
              "https://mirrors.cloud.tencent.com/gradle/${GRADLE_ZIP}" -o "${LOCAL_ZIP}" || rm -f "${LOCAL_ZIP}"
          fi

          if [ ! -s "${LOCAL_ZIP}" ]; then
            echo "Trying services.gradle.org with browser User-Agent..."
            curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 \
              -A "Mozilla/5.0" \
              "https://services.gradle.org/distributions/${GRADLE_ZIP}" -o "${LOCAL_ZIP}" || rm -f "${LOCAL_ZIP}"
          fi

          if [ -s "${LOCAL_ZIP}" ]; then
            ls -lh "${LOCAL_ZIP}"
            sed -i -E "s|^distributionUrl=.*|distributionUrl=file\\\\:///tmp/gradle-dist/${GRADLE_ZIP}|" gradle/wrapper/gradle-wrapper.properties
            sed -i -E "s|^validateDistributionUrl=.*|validateDistributionUrl=false|" gradle/wrapper/gradle-wrapper.properties
            sed -i -E "/^distributionSha256Sum=/d" gradle/wrapper/gradle-wrapper.properties
            cat gradle/wrapper/gradle-wrapper.properties
          fi

          ./gradlew --version --no-daemon

          # 2. Run release AAB + APK build with automatic retry on transient network timeouts
          BUILD_OK=0
          for attempt in 1 2 3; do
            echo "Running Gradle bundleRelease assembleRelease (attempt $attempt/3)..."
            if ./gradlew bundleRelease assembleRelease --no-daemon; then
              BUILD_OK=1
              break
            fi
            echo "::warning::Gradle build attempt $attempt failed; retrying in 5 seconds..."
            sleep 5
          done
          if [ "$BUILD_OK" -ne 1 ]; then
            echo "::error::Gradle release build failed after 3 attempts."
            exit 1
          fi

          mkdir -p ../dist-release/aab ../dist-release/apk
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$AAB_FILE" ] || [ ! -s "$AAB_FILE" ]; then
            echo "::error::Release AAB file was not generated!"
            exit 1
          fi
          if [ -z "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
            echo "::error::Release APK file was not generated!"
            exit 1
          fi
          cp "$AAB_FILE" "../dist-release/aab/Yaad-v${{ steps.versioning.outputs.v_name }}-b${{ steps.versioning.outputs.v_code }}-release.aab"
          cp "$APK_FILE" "../dist-release/apk/Yaad-v${{ steps.versioning.outputs.v_name }}-b${{ steps.versioning.outputs.v_code }}-release.apk"
          ls -lh ../dist-release/aab ../dist-release/apk

      - name: Upload Release AAB (For Cafe Bazaar & Myket)
        id: upload_aab
        uses: actions/upload-artifact@v6
        with:
          name: Yaad-Release-AAB
          path: dist-release/aab/*.aab
          if-no-files-found: error
          overwrite: true

      - name: Upload Release APK
        id: upload_apk
        uses: actions/upload-artifact@v6
        with:
          name: Yaad-Release-APK
          path: dist-release/apk/*.apk
          if-no-files-found: error
          overwrite: true

      - name: Retry Upload Release APK (if needed)
        id: retry_apk
        if: steps.upload_apk.outputs.artifact-id == ''
        uses: actions/upload-artifact@v6
        with:
          name: Yaad-Release-APK
          path: dist-release/apk/*.apk
          if-no-files-found: error
          overwrite: true

      - name: Verify Both Artifacts & Publish Build Summary
        env:
          AAB_ID: ${{ steps.upload_aab.outputs.artifact-id }}
          AAB_URL: ${{ steps.upload_aab.outputs.artifact-url }}
          APK_ID: ${{ steps.upload_apk.outputs.artifact-id || steps.retry_apk.outputs.artifact-id }}
          APK_URL: ${{ steps.upload_apk.outputs.artifact-url || steps.retry_apk.outputs.artifact-url }}
          V_CODE: ${{ steps.versioning.outputs.v_code }}
          V_NAME: ${{ steps.versioning.outputs.v_name }}
        run: |
          if [ -z "$AAB_ID" ]; then
            echo "::error::AAB artifact upload did not return an artifact ID."
            exit 1
          fi
          if [ -z "$APK_ID" ]; then
            echo "::error::APK artifact upload did not return an artifact ID."
            exit 1
          fi
          {
            echo "### ✅ ساخت نسخه‌های انتشار یاد (AAB و APK) با موفقیت انجام شد"
            echo ""
            echo "- **نام نسخه اعمال‌شده در کل اپ (اسپلش، درباره، تنظیمات و اندروید):** \`${V_NAME}\`"
            echo "- **کد نسخه (versionCode):** \`${V_CODE}\`"
            echo ""
            echo "| نوع خروجی | نام آرتیفکت | وضعیت | لینک دانلود مستقیم |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **AAB (کافه‌بازار و مایکت)** | \`Yaad-Release-AAB\` | ✅ آماده (\`#${AAB_ID}\`) | [دانلود Yaad-Release-AAB](${AAB_URL}) |"
            echo "| **APK (نصب مستقیم)** | \`Yaad-Release-APK\` | ✅ آماده (\`#${APK_ID}\`) | [دانلود Yaad-Release-APK](${APK_URL}) |"
          } >> "$GITHUB_STEP_SUMMARY"
